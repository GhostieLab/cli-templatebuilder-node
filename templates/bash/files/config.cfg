# config/config.cfg

# General project configuration
APP_NAME="MyBashTool"
APP_VERSION="0.1.0"

# Log location (can be overridden through environment variables)
LOG_DIR="./logs"
LOG_FILE="$LOG_DIR/app.log"

# Debug mode (true/false)
DEBUG="false"

# Default user (for scripts that need to run as another user)
DEFAULT_USER="nobody"

# Default timeout (in seconds)
TIMEOUT=10

# External API (if applicable)
API_URL="https://api.example.com"

# Additional project-specific settings
